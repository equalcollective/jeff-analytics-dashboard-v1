/* ─────────── GOAL BANNER ─────────── */

function bannerStatus(count, goal, expectedFrac) {
  // returns {color, badgeCls, fillCls, label}
  const pct = count/goal;
  const ratio = expectedFrac > 0 ? pct/expectedFrac : 1;
  let cls, label;
  if (ratio >= 1.10) { cls='green'; label='AHEAD'; }
  else if (ratio >= 0.95) { cls='green'; label='ON PACE'; }
  else if (ratio >= 0.80) { cls='amber'; label='BEHIND'; }
  else { cls='red'; label='BEHIND'; }
  return {cls, label, pctI: Math.round(pct*100)};
}

function renderBanner() {
  const monthExpected = BANNER.monthDayX / BANNER.monthDayY;
  const tiles = [
    {
      title:'Meetings This Week',
      count:BANNER.meetingsWeek, goal:BANNER.meetingsWeekGoal,
      goalLbl:`of ${BANNER.meetingsWeekGoal} goal`,

    },
    {

  ];
  const html = tiles.map(t => {
    const fillPct = Math.min(100, (t.count/t.goal)*100).toFixed(1);
    return `<div class="tile">
      <h3>${t.title}</h3>

function median(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a,b)=>a-b);
  const m = Math.floor(s.length/2);
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}

const TREND_LINE_SERIES = [
  {k:'p',  label:'Prospects Reached',  color:'#6366f1', fmt:v => fmt(Math.round(v))},
  {k:'rr', label:'Reply Rate',         color:'#10b981', fmt:v => pct2(v)},
  {k:'br', label:'SMTP Bounce Rate',   color:'#ef4444', fmt:v => pct2(v)},
  {k:'posRate',   label:'Pos. Reply Rate', color:'#f59e0b', fmt:v => pct3(v)},
  {k:'bookRate',  label:'Booking Rate',    color:'#22d3ee', fmt:v => pct3(v)}
];
const TREND_BAR_SERIES = [
  {k:'p',   label:'Prospects Reached', color:'#6366f1'},
  {k:'r',   label:'Replies',           color:'#10b981'},
  {k:'b',   label:'Bounces',           color:'#ef4444'},
  {k:'pos', label:'CRM Positive Replies', color:'#f59e0b'},
  {k:'mtg', label:'Meetings Booked',   color:'#22d3ee'}
];

function trendData(mode) {
  const rows = mode==='cohort' ? WEEKLY_COHORT : WEEKLY_ACTIVITY;
  // oldest left, newest right
  const sorted = [...rows].sort((a,b) => a.wk.localeCompare(b.wk));
  return sorted.map(r => ({
    wk: r.wk,
    wkLabel: r.wkLabel + (r.partial ? ' (partial)' : ''),
    p: r.p, e: r.e, r: r.r, b: r.b, pos: r.pos, mtg: r.mtg,
    rr: r.rr, br: r.br,
    posRate: safeDiv(r.pos, r.p) ?? 0,
    bookRate: safeDiv(r.mtg, r.p) ?? 0
  }));
}

function renderLineChart(mode, active) {
  const data = trendData(mode);
  const W = 900, H = 260, PAD = {t:14, r:14, b:36, l:8};
  const innerW = W - PAD.l - PAD.r;
  const innerH = H - PAD.t - PAD.b;
  const n = data.length;
  const xStep = n > 1 ? innerW / (n-1) : innerW;

  // amplitude-normalize each series independently
  const ranges = {};
  TREND_LINE_SERIES.forEach(s => {
    const vals = data.map(d => d[s.k]);
    const min = Math.min(...vals), max = Math.max(...vals);
    ranges[s.k] = {min, max};
  });

  const norm = (val, k) => {
    const {min, max} = ranges[k];
    if (max === min) return 0.5;
    return (val - min) / (max - min);
  };

  const xAt = i => PAD.l + i*xStep;
  const yAt = v => PAD.t + (1 - v) * innerH;

  const paths = TREND_LINE_SERIES.map(s => {
    if (!active[s.k]) return '';
    const pts = data.map((d, i) => {
      const y = yAt(norm(d[s.k], s.k));
      return `${i===0 ? 'M' : 'L'}${xAt(i).toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const dots = data.map((d, i) => `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(norm(d[s.k], s.k)).toFixed(1)}" r="3" fill="${s.color}" data-k="${s.k}" data-i="${i}" style="cursor:pointer"/>`).join('');
    return `<g><path d="${pts}" fill="none" stroke="${s.color}" stroke-width="2"/>${dots}</g>`;
  }).join('');

  const xLabels = data.map((d, i) => {
    const [_, mm, dd] = d.wk.split('-');
    return `<text x="${xAt(i)}" y="${H - PAD.b + 16}" fill="#666a76" font-size="10" text-anchor="middle">${mm}/${dd}</text>`;
  }).join('');

  const svg = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-chart="line">
    <line x1="${PAD.l}" y1="${H-PAD.b}" x2="${W-PAD.r}" y2="${H-PAD.b}" stroke="#262a36"/>
    ${paths}
    ${xLabels}
    <text x="${W-PAD.r}" y="${H-4}" fill="#666a76" font-size="10" text-anchor="end">relative — hover for true value</text>
  </svg>`;
  return {svg, data, ranges};
}

function renderBarChart(mode, active) {
  const data = trendData(mode);
  const W = 900, H = 260, PAD = {t:14, r:8, b:36, l:56};
  const innerW = W - PAD.l - PAD.r;
  const innerH = H - PAD.t - PAD.b;
  const n = data.length;
  const groupW = innerW / n;
  const activeKeys = TREND_BAR_SERIES.filter(s => active[s.k]).map(s => s.k);
  const nActive = activeKeys.length || 1;
  const barW = Math.max(2, (groupW - 6) / nActive);

  // rescale y-axis to currently visible series
  let vmax = 0;
  data.forEach(d => activeKeys.forEach(k => { if (d[k] > vmax) vmax = d[k]; }));
  vmax = vmax || 1;

  // check whether to use log axis: if visible series span >= 100x at once
  let useLog = false;
  if (activeKeys.length >= 2) {
    let mxAll = 0, mnAll = Infinity;
    activeKeys.forEach(k => {
      const kmax = Math.max(...data.map(d => d[k]));
      const kmin = Math.min(...data.map(d => d[k]).filter(v => v > 0));
      if (kmax > mxAll) mxAll = kmax;
      if (kmin < mnAll && kmin > 0) mnAll = kmin;
    });
    if (mxAll / mnAll >= 100) useLog = true;
  }

  const yAt = v => {
    if (useLog) {
      const lv = v > 0 ? Math.log10(v) : 0;
      const lmax = Math.log10(Math.max(vmax, 10));
      return PAD.t + (1 - lv/lmax) * innerH;
    }
    return PAD.t + (1 - v/vmax) * innerH;
  };

  const bars = data.map((d, i) => {
    const gx = PAD.l + i*groupW + 3;
    return activeKeys.map((k, j) => {
      const s = TREND_BAR_SERIES.find(x => x.k === k);
      const v = d[k];
      const y = yAt(v);
      const h = Math.max(0, (H - PAD.b) - y);
      return `<rect x="${(gx + j*barW).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${s.color}" data-k="${k}" data-i="${i}" style="cursor:pointer"/>`;
    }).join('');
  }).join('');

  const nTicks = 4;
  let ticks = '';
  if (useLog) {
    const lmax = Math.log10(Math.max(vmax, 10));
    for (let t = 0; t <= nTicks; t++) {
      const v = Math.pow(10, (t/nTicks)*lmax);
      const y = yAt(v);
      ticks += `<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="#1f2330" stroke-dasharray="2,3"/>
        <text x="${PAD.l - 6}" y="${y+3}" fill="#666a76" font-size="10" text-anchor="end">${fmt(Math.round(v))}</text>`;
    }
  } else {
    for (let t = 0; t <= nTicks; t++) {
      const v = (t/nTicks) * vmax;
      const y = yAt(v);
      ticks += `<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="#1f2330" stroke-dasharray="2,3"/>
        <text x="${PAD.l - 6}" y="${y+3}" fill="#666a76" font-size="10" text-anchor="end">${fmt(Math.round(v))}</text>`;
    }
  }

  const xLabels = data.map((d, i) => {
    const [_, mm, dd] = d.wk.split('-');
    const cx = PAD.l + i*groupW + groupW/2;
    return `<text x="${cx}" y="${H - PAD.b + 16}" fill="#666a76" font-size="10" text-anchor="middle">${mm}/${dd}</text>`;
  }).join('');

  const svg = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-chart="bar">
    ${ticks}
    ${bars}
    ${xLabels}
    <text x="${W-PAD.r}" y="${H-4}" fill="#666a76" font-size="10" text-anchor="end">y-axis: ${useLog ? 'log' : 'linear'}, rescaled to visible series</text>
  </svg>`;
  return {svg, data, useLog, vmax};
}

function trendChipsLine(active, ranges) {

    return `<button class="chip ${on ? 'on' : 'off'}" data-k="${s.k}">
      <span class="swatch" style="background:${s.color}"></span>${s.label}
      <span class="rng num">${fmtR(rng.min)}–${fmtR(rng.max)}</span>
    </button>`;
  }).join('');
}
function trendChipsBar(active) {
  return TREND_BAR_SERIES.map(s => {
    const on = active[s.k];
    return `<button class="chip ${on ? 'on' : 'off'}" data-k="${s.k}">

let trendState = {
  mode: 'activity',
  lineActive: {p:true, rr:true, br:true, posRate:true, bookRate:true},

function attachChartHover(container) {
  container.querySelectorAll('svg[data-chart]').forEach(svg => {
    const chartKind = svg.dataset.chart;
    const rect = svg.getBoundingClientRect();
    svg.querySelectorAll('[data-k]').forEach(el => {
      el.addEventListener('mouseenter', (ev) => {
        const k = el.dataset.k, i = +el.dataset.i;
        const data = trendState.currentData;
        const d = data[i];
        let html = `<div style="font-weight:600;margin-bottom:2px">${d.wkLabel}</div>`;
        if (chartKind === 'line') {
          const s = TREND_LINE_SERIES.find(x => x.k === k);
          html += `<div>${s.label}: <span class="num">${s.fmt(d[k])}</span></div>`;
        } else {
          const s = TREND_BAR_SERIES.find(x => x.k === k);
          html += `<div>${s.label}: <span class="num">${fmt(d[k])}</span></div>`;
        }
        showTT(ev.clientX, ev.clientY, html);
      });
      el.addEventListener('mouseleave', hideTT);
      el.addEventListener('mousemove', (ev) => {
        tt.style.left = (ev.clientX+12)+'px';
        tt.style.top  = (ev.clientY+12)+'px';
      });
    });
  });
}

function renderTrends() {
  const {mode, lineActive, barActive} = trendState;

  const html = `

/* ─────────── FUNNEL DIAGNOSTIC ─────────── */

function funnelData(mode) {
  const rows = mode==='cohort' ? WEEKLY_COHORT : WEEKLY_ACTIVITY;
  // sorted newest first — index 0 is current partial, 1..6 are the last 6 complete
  const sorted = [...rows].sort((a,b) => b.wk.localeCompare(a.wk));
  const cur = sorted[0];
  const prev6 = sorted.slice(1, 7);
  const agg = prev6.reduce((a, r) => {
    a.p += r.p; a.r += r.r; a.pos += r.pos; a.mtg += r.mtg; return a;
  }, {p:0, r:0, pos:0, mtg:0});
  return {
    cur: {
      wkLabel: cur.wkLabel + (cur.partial ? ' (partial)' : ''),
      p: cur.p,
      replyRate: cur.rr,
      posRate: safeDiv(cur.pos, cur.p) ?? 0,
      bookRate: safeDiv(cur.mtg, cur.p) ?? 0,
      posBook: safeDiv(cur.mtg, cur.pos) ?? 0
    },
    avg: {
      p: agg.p / prev6.length,
      replyRate: safeDiv(agg.r, agg.p) ?? 0,
      posRate: safeDiv(agg.pos, agg.p) ?? 0,
      bookRate: safeDiv(agg.mtg, agg.p) ?? 0,
      posBook: safeDiv(agg.mtg, agg.pos) ?? 0
    }
  };
}

function stepColor(cur, avg) {
  if (avg === 0) return 'green';
  const ratio = cur/avg;
  if (ratio >= 1.0) return 'green';
  if (ratio >= 0.70) return 'amber';   // within 30% below
  return 'red';
}

function renderFunnel(mode) {
  const {cur, avg} = funnelData(mode);
  const steps = [
    {name:'Prospects Reached',   cur: cur.p, avg: avg.p,
     fmt:v => fmt(Math.round(v))},
    {name:'Emails Delivered — Reply Rate', cur: cur.replyRate, avg: avg.replyRate,
     fmt:pct2},
    {name:'Positive Replies — Pos. Reply Rate', cur: cur.posRate, avg: avg.posRate,
     fmt:pct3},
    {name:'Meetings Booked — Booking Rate', cur: cur.bookRate, avg: avg.bookRate,
     fmt:pct3}
  ];
  const rows = [];
  steps.forEach((s, i) => {
    const cls = 'step-' + stepColor(s.cur, s.avg);
    rows.push(`<div class="step ${cls}">
      <div class="name">${s.name}</div>
      <div class="this num">${s.fmt(s.cur)}</div>
      <div class="avg num">6-wk avg: ${s.fmt(s.avg)}</div>
      <div class="avg">this / avg: <span class="num">${s.avg !== 0 ? (s.cur/s.avg*100).toFixed(0)+'%' : '—'}</span></div>
    </div>`);
    if (i === 2) {
      // Pos → Book label between step 3 and 4
      rows.push(`<div class="step-arrow">↓ <span class="between">Pos → Book this week: <span class="num">${pct2(cur.posBook)}</span> · 6-wk avg: <span class="num">${pct2(avg.posBook)}</span></span></div>`);
    } else if (i < steps.length - 1) {
      rows.push(`<div class="step-arrow">↓</div>`);
    }
  });
  return `<div class="subhead">This week: ${cur.wkLabel}</div><div class="funnel">${rows.join('')}</div>`;
}

/* ─────────── SERIES PERFORMANCE ─────────── */

const SERIES_BUCKETS = [
  {id:'current', label:'Current week (partial)', weeks:['2026-08-17']},
  {id:'w1',      label:'Last 1 week',            weeks:['2026-08-10']},
  {id:'w2',      label:'Last 2 weeks',           weeks:['2026-08-10','2026-08-03']},
  {id:'w3',      label:'Last 3 weeks',           weeks:['2026-08-10','2026-08-03','2026-07-27']},
  {id:'w4',      label:'Last 4 weeks',           weeks:['2026-08-10','2026-08-03','2026-07-27','2026-07-20']}
];

function aggregateSeries(weeks) {
  const byKey = new Map();
  SERIES_ROWS.filter(r => weeks.includes(r.wk)).forEach(r => {
    const key = r.ser + '-' + r.sub;
    if (!byKey.has(key)) {
      byKey.set(key, {ser:r.ser, sub:r.sub, p:0, e:0, e1:0, r:0, e1r:0, b:0, pos:0, mtg:0});
    }
    const a = byKey.get(key);
    a.p += r.p; a.e += r.e; a.e1 += r.e1; a.r += r.r; a.e1r += r.e1r;
    a.b += r.b; a.pos += r.pos; a.mtg += r.mtg;
  });
  const rows = [...byKey.values()];
  // sort by booking rate descending; rows with p=0 pushed to bottom
  rows.sort((a, b) => {
    const ar = a.p > 0 ? a.mtg/a.p : -1;
    const br = b.p > 0 ? b.mtg/b.p : -1;
    return br - ar;
  });
  return rows;
}

  return html;
}
